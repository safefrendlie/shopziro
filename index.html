<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shopziro | Your Business. Your World.</title>
    <meta
      name="description"
      content="A digital commerce platform where anyone can create, customize, showcase, and grow their own online store."
    />
    <meta name="theme-color" content="#1e1b4a" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shopziro" />
    <meta property="og:title" content="Shopziro | Your Business. Your World." />
    <meta property="og:description" content="Create, customize, showcase and grow your own online store." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;800&family=Playfair+Display:wght@500;700&family=Poppins:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; background: #141238; }
      .splash { position: fixed; inset: 0; display: grid; place-items: center; background: #141238; color: #f6f4ff;
        font-family: 'Poppins', system-ui, sans-serif; }
      .splash-inner { display: grid; justify-items: center; gap: 14px; animation: splashIn .6s ease both; }
      .splash-word { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
      .splash-word b { color: #ff894c; font-weight: 700; }
      .splash-tag { font-size: 13px; color: #c9c3f5; font-family: Inter, system-ui, sans-serif; letter-spacing: .04em; }
      @keyframes splashIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-label="Loading Shopziro">
        <div class="splash-inner">
          <svg width="84" height="84" viewBox="0 0 1024 1024" aria-hidden="true">
            <rect width="1024" height="1024" rx="230" fill="#fff" />
            <path d="M259 312h126v107a63 63 0 0 1-126 0z" fill="#e8590b" />
            <path d="M385 312h127v107a63.5 63.5 0 0 1-127 0z" fill="#3b2bb0" />
            <path d="M512 312h126v107a63 63 0 0 1-126 0z" fill="#e8590b" />
            <path d="M638 312h127v107a63.5 63.5 0 0 1-127 0z" fill="#3b2bb0" />
            <ellipse cx="512" cy="644" rx="80" ry="113" fill="none" stroke="#3b2bb0" stroke-width="46" />
          </svg>
          <div class="splash-word">Shop<b>ziro</b></div>
          <div class="splash-tag">Your Business. Your World.</div>
        </div>
      </div>
    </div>
    <noscript>Shopziro needs JavaScript to run. Please enable it in your browser.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
